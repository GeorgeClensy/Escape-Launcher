ksp = "2.3.6"
coreSplashscreen = "1.2.0"
graphicsShapes = "1.1.0"
gson = "2.14.0"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"

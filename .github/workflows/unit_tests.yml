name: Unit Tests

on:
  push:
    branches: [ "main", "refactor" ]
  pull_request:
    branches: [ "main", "refactor" ]
  workflow_dispatch: 

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This runs unit tests for all modules. 
      # We use testDebugUnitTest to cover all common code paths.
      - name: Run tests
        run: ./gradlew testFossDebugUnitTest

      # Upload the test results so you can see why they failed in the GitHub UI
      - name: Upload Test Reports
        if: always() # Run this even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

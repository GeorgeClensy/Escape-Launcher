name: F-Droid Pre-Upload Check

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install F-Droid Server tools
        run: |
          sudo apt-get update
          # Install Android build tools required by F-Droid
          sudo apt-get install -y aapt apksigner zipalign
          # Install the bleeding-edge fdroidserver directly from their GitLab
          pip install git+https://gitlab.com/fdroid/fdroidserver.git
          
      - name: Initialize Dummy F-Droid Repo
        run: |
          mkdir fdroid-workspace
          cd fdroid-workspace
          fdroid init
          
          # F-Droid expects metadata to live in a "metadata" folder
          mkdir -p metadata
          
          # Copy your local F-Droid recipe into the workspace
          # CHANGE "com.your.appid" to your actual app's ID!
          cp ../.fdroid/com.your.appid.yml metadata/
          
      - name: Run F-Droid Lint
        run: |
          cd fdroid-workspace
          # Checks your YAML file for syntax errors, missing fields, etc.
          fdroid lint com.your.appid

      - name: Run F-Droid Scanner
        run: |
          cd fdroid-workspace
          # Scans your source code for non-free binaries, proprietary libraries 
          # (like Google Play Services), or pre-compiled .jar/.so files.
          fdroid scanner com.your.appid
          
      - name: Test F-Droid Build
        run: |
           cd fdroid-workspace
           fdroid build -v -l com.your.appid

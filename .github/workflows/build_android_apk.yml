name: Build Android APK

on:
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  build:
    name: Build FOSS Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (Standard for modern Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up future builds

      # 3. Make the Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the app using Gradle (targeting the FOSS variant to avoid Google API requirements)
      - name: Build with Gradle
        run: ./gradlew assembleFossDebug

      # 5. Upload the compiled APK so you can download it
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Escape-Launcher-Foss-Debug
          # Using wildcards here ensures the Action finds the APK even if the 
          # refactor branch moves the output directory slightly.
          path: '**/build/outputs/apk/foss/debug/*.apk'
          retention-days: 3
